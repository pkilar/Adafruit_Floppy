; PlatformIO project for the Atari SIO drive firmware. Run `pio run` in this
; folder; see "Building with PlatformIO" in README.md.
;
; The sketch (atari_sio_drive.ino, ui.cpp) is built in place, and the
; Adafruit_Floppy library is this repository, linked in with symlink://.

[platformio]
; pio/main.cpp includes the sketch and ui.cpp (see there).
src_dir = pio
default_envs = floppy_sio_rp2350b

; ---------------------------------------------------------------------------
; Settings shared by all boards
; ---------------------------------------------------------------------------
[common]
monitor_speed = 115200
; Registry libraries, pinned to the versions the Arduino CI builds were checked
; with. Adafruit_Floppy itself comes from ../.. (a symlink, so a registry copy
; is never installed next to it).
lib_deps =
    symlink://../..
    adafruit/SdFat - Adafruit Fork @ 2.3.103
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit TinyUSB Library @ 3.7.7
    adafruit/Adafruit GFX Library @ 1.13.0
    adafruit/Adafruit NeoPixel
    adafruit/Adafruit INA3221 Library
    adafruit/Adafruit ST7735 and ST7789 Library
lib_ldf_mode = deep+
; PlatformIO does not give the Adafruit_Floppy library the include path of
; SdFat (it only finds the dependencies in library.properties by scanning), so
; add it by hand.
build_flags =
    -DUSE_TINYUSB
    -Wall
    '-I$PROJECT_LIBDEPS_DIR/$PIOENV/SdFat - Adafruit Fork/src'

; ---------------------------------------------------------------------------
; Earle Philhower's arduino-pico core (RP2040 and RP2350)
; ---------------------------------------------------------------------------
[rp2]
; maxgerhardt's platform, pinned to a commit (it pins arduino-pico itself)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 150000000L
upload_protocol = picotool
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags = ${common.build_flags}

; ---------------------------------------------------------------------------
; The custom RP2350B board (floppy-rp2350b-pcb). OLED_TYPE chooses the display
; (see ui_config.h): 1 = SH1106 on I2C, 2 = SH1106 on SPI, 3 = SSD1306 on SPI,
; 4 = SSD1309 on SPI.
; ---------------------------------------------------------------------------
[rp2350b]
extends = rp2
board = generic_rp2350
board_build.filesystem_size = 0m
lib_deps =
    ${rp2.lib_deps}
    adafruit/Adafruit SH110X @ 2.1.15
    adafruit/Adafruit SSD1306 @ 2.5.17
build_flags =
    ${rp2.build_flags}
    -DFLOPPY_SIO_RP2350B_REVA
    -D__PICO_RP2350A=0
    -DRP2350_PSRAM_CS=0

[env:floppy_sio_rp2350b]
extends = rp2350b
build_flags = ${rp2350b.build_flags} -DOLED_TYPE=1

[env:floppy_sio_rp2350b_sh1106_spi]
extends = rp2350b
build_flags = ${rp2350b.build_flags} -DOLED_TYPE=2

[env:floppy_sio_rp2350b_ssd1306_spi]
extends = rp2350b
build_flags = ${rp2350b.build_flags} -DOLED_TYPE=3

; SSD1309 (2.42" modules), driven by Adafruit_SSD1306
[env:floppy_sio_rp2350b_ssd1309_spi]
extends = rp2350b
build_flags = ${rp2350b.build_flags} -DOLED_TYPE=4

; ---------------------------------------------------------------------------
; The other boards (no display)
; ---------------------------------------------------------------------------
[env:feather_rp2040]
extends = rp2
board = adafruit_feather
board_build.f_cpu = 120000000L

[env:floppsy_rp2040]
extends = rp2
board = adafruit_floppsy
board_build.f_cpu = 120000000L

[env:feather_rp2350]
extends = rp2
board = adafruit_feather_rp2350_hstx
board_build.f_cpu = 120000000L

; The Adafruit SAMD core has Adafruit TinyUSB built in (USE_TINYUSB), so the
; library must not be installed as well.
[env:feather_m4_express]
platform = atmelsam
framework = arduino
board = adafruit_feather_m4
board_build.f_cpu = 120000000L
upload_protocol = sam-ba
monitor_speed = ${common.monitor_speed}
lib_deps =
    symlink://../..
    adafruit/SdFat - Adafruit Fork @ 2.3.103
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit GFX Library @ 1.13.0
lib_ldf_mode = ${common.lib_ldf_mode}
build_flags =
    ${common.build_flags}
    -DADAFRUIT_FEATHER_M4_EXPRESS
